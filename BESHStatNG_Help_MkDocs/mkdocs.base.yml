site_name: BESHStatNG Help
repo_url: null

theme:
  name: material
  favicon: assets/images/favicon.ico
  features:
    - navigation.sections
    - navigation.instant
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - tables
  - toc
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
- Home: index.md
- Getting started: getting-started.md
- Implementation notes: implementation-notes.md
