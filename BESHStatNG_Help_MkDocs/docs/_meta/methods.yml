  title: Bland–Altman Analysis
  slug: bland-altman
  short: "**Includes:** Simple paired Bland–Altman analysis, repeated-measures Bland–Altman by subject, bias and limits of agreement (LoA), analytical / jackknife / bootstrap confidence intervals, optional proportional-bias check, raw-difference / percentage / log-ratio scales, several x-axis conventions, and Bland–Altman plots with optional subject means."
  ribbonIds:
  - Ui9ANOVA2nested
  onActions:
  - OnbtmBlandAltman
  forms:
