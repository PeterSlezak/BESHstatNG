  slug: generalized-estimating-equations-gee
  short: "**Includes:** Families: Gaussian, Binomial, Poisson, Negative Binomial,\
    \ Gamma, Covariance structures: Independence, Exchangeable, Autoregressive, Unstructured,\
    \ SE types: Robust, Naive, Bias-reduced, categorical factors, polynomial terms,\
    \ continuous-variable interactions, optional starting values.  \nFit marginal\
    \ models for correlated/clustered data using GEE with selectable working correlation."
