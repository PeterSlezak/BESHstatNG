  - btm8_5KMC
  onActions:
  - OnbtmFAPressed
  forms:
  - handler: OnbtmFAPressed
    form: Ui11PCA
    analysisTitle: Factor Analysis
  categories:
  - Multivariate Analysis
- key: FriedmanTest
  title: Friedman Test
  slug: friedman-test
  short: "**Includes:** Friedman test, Post-hoc multiple comparisons (MCP), Descriptive\
    \ stats (optional), Box plot (optional).  \nNonparametric repeated-measures alternative\
    \ to one-way RM ANOVA for ranked data across conditions."
