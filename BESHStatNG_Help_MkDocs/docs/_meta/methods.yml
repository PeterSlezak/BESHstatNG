- key: ZeroInflatedPoissonRegression
  title: Zero-Inflated Poisson Regression
  slug: zero-inflated-poisson-regression
  short: "**Includes:** ZIP model (Poisson count + logistic inflation part), separate\
    \ authored effects for the Poisson and Logistic components, categorical factors,\
    \ polynomial terms, continuous-variable interactions, EM-style fitting (with iterations/ε),\
    \ optional starting values for both parts.  \nModel count data with excess zeros\
    \ by combining a Poisson model with a separate zero-inflation process."
  ribbonIds:
  - btm7_6ZIP
  onActions:
  - OnbtmZeroPressed
  forms:
  - handler: OnbtmZeroPressed
    form: UiGLM
    analysisTitle: Zero-Inflated Poisson Regression
