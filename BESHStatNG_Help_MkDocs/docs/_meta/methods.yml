  title: Symmetry
  slug: symmetry
  short: "**Includes:** Miao–Gel–Gastwirth test, Cabilio–Masaro test, Asymmetry plot\
    \ (optional).  \nEvaluate whether a distribution is symmetric around its center\
    \ and visualize asymmetry when needed."
  ribbonIds:
  - btm1_4Symmetry
