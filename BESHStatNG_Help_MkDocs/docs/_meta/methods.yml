- key: DescriptiveStatistics
  title: Descriptive Statistics
  slug: descriptive-statistics
  short: "**Includes:** n, mean, median, SD / variance, SEM, CV, skewness / kurtosis,\
    \ Q1 / Q3, IQR, min / max / range, Shapiro–Wilk (optional).  \nCompute a compact\
    \ set of summary statistics for one or multiple variables, optionally adding a\
    \ normality check."
