    form: Ui9ANOVA2nested
    analysisTitle: null
  categories:
  - Parametric
- key: UnivariateOutliers
  title: Univariate Outliers
  slug: univariate-outliers
  short: "**Includes:** Grubbs’ test (single outlier), Rosner / generalized ESD (multiple\
    \ outliers).  \nIdentify statistically unusual values in a single variable, with\
    \ options suited to one or multiple outliers."
  ribbonIds:
  - btm1_2Outliers
  onActions:
  - OnbtmOutliersPressed
  forms:
  - handler: OnbtmOutliersPressed
    form: UibyID
    analysisTitle: Outliers
  categories:
  - Assumptions
- key: UnpairedTwoSampleTTests
  title: Unpaired (two sample) T tests
  slug: unpaired-two-sample-t-tests
  short: "**Includes:** Pooled-variance t-test, Welch t-test, F-test for variances\
    \ (optional).  \nCompare two independent groups under (or relaxing) the equal-variance\
    \ assumption."
  ribbonIds:
  - btm3_2UnpairedT
  onActions:
