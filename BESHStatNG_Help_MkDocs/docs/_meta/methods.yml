  title: Wilcoxon Signed Rank Test
  slug: wilcoxon-signed-rank-test
  short: "**Includes:** Exact p-values (when available), Normal approximation (ties\
    \ + continuity correction), Hodges–Lehmann shift estimate, Sign test (optional).\
    \  \nNonparametric paired comparison test for matched samples or before/after\
    \ measurements."
