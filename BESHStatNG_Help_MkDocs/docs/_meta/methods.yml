- key: CoxRegression
  title: Cox Regression
  slug: cox-regression
  short: "**Includes:** Cox proportional hazards model, Tie handling: Breslow, Efron,\
    \ Exact, categorical factors, polynomial terms, continuous-variable interactions,\
    \ optional starting values, robust variance (optional), residuals + PH score test\
    \ (optional), baseline + adjusted survival curves.  \nFit a proportional hazards\
    \ model to time-to-event data and report hazard ratios with diagnostics."
