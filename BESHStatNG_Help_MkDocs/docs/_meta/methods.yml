    form: Ui9ANOVA2nested
    analysisTitle: Passing-Bablok Regression
  categories:
  - Agreement
- key: DemingRegression
  title: Deming Regression
  slug: deming-regression
  short: "**Includes:** Deming (errors-in-variables) regression with configurable error ratio (λ), weighted/generalized variance models, point estimates and confidence intervals.  \nUse when both X and Y have measurement error and you want a symmetric method-comparison regression."
  ribbonIds:
  - btn10_2Deming
  onActions:
  - OnbtmDeming
  forms:
  - handler: OnbtmDeming
    form: UiTwoInputRefedits
    analysisTitle: Deming Regression
  categories:
  - Agreement
