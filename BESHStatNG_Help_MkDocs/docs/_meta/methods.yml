  slug: generalized-linear-models-glm
  short: "**Includes:** GLM families: Gaussian, Binomial, Poisson, Negative Binomial,\
    \ Gamma, Links per family (selectable), categorical factors, polynomial terms,\
    \ continuous-variable interactions, optional starting values, optional weights\
