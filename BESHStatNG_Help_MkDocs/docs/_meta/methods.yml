  slug: cohens-kappa
  short: "**Includes:** Cohen's / weighted kappa for paired categorical ratings, with unweighted, linear, quadratic, Cicchetti–Allison, and Fleiss–Cohen weighting schemes; analytical and bootstrap confidence intervals; confusion-matrix output; and weight-matrix output."
