- key: FactorAnalysis
  title: Factor Analysis
  slug: factor-analysis
  short: "**Includes:** Exploratory factor analysis on correlation or covariance matrices;\
    \ extraction by principal axis, maximum likelihood, generalized least squares, image,\
    \ alpha, or principal-components style extraction; retention by fixed count / eigenvalue\
    \ cutoff / cumulative variance; orthogonal or oblique rotation; factor scores; diagnostics;\
