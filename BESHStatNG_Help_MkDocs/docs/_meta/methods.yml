  forms:
  - handler: OnbtmUnpairedTPressed
    form: UibyID
    analysisTitle: Unpaired T-test
  categories:
  - Parametric
- key: UnpairedTTest
  title: Sample Size – Unpaired T-test
  slug: sample-size-unpaired-t-test
  short: "**Includes:** Sample size for unpaired t-test (with group ratio κ).  \n\
    Estimate required sample sizes per group for a two-sample t-test given effect\
    \ size, SD, α and power."
