  - Regression
- key: PassingBablokRegression
  title: Passing–Bablok Regression
  slug: passing-bablok-regression
  short: "**Includes:** Passing–Bablok nonparametric linear regression for method comparison, slope/intercept estimates, confidence intervals, and robust handling of outliers.  \nUse when comparing two measurement methods without assuming normal errors or homoscedasticity."
  ribbonIds:
  - btn10_1PassingBablok
  onActions:
  - OnbtmPassingBablok
  forms:
