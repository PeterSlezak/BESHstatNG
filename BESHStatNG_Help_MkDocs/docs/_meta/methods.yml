    analysisTitle: Symmetry
  categories:
  - Assumptions
- key: TheilSenSimpleRegression
  title: Theil-Sen Simple Regression
  slug: theil-sen-simple-regression
  short: "**Includes:** Median slope (Theil–Sen), CI at the selected level (Sen/large-sample approx.),\
    \ Robust intercept.  \nUse when you want a robust simple linear trend estimate\
    \ that resists outliers."
  ribbonIds:
  - btm4_9TheilSen
  onActions:
  - OnbtmTheilSenPressed
  forms:
  - handler: OnbtmTheilSenPressed
    form: UiTwoInputRefedits
    analysisTitle: Theil-Sen Simple Regression
  categories:
  - Nonparametric
- key: TwoWayNestedANOVA
  title: Two-Way Nested ANOVA
  slug: two-way-nested-anova
  short: "**Includes:** Two-way nested ANOVA, Balanced design check, Satterthwaite\
    \ approximation.  \nAnalyze hierarchical (nested) designs such as subjects nested\
    \ within centers, with appropriate variance decomposition."
  ribbonIds:
  - btm3_5TwoWayNested
  onActions:
  - Onbtm2WayNestedPressed
